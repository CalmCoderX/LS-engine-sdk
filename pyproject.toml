[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexashield-engine-sdk"
version = "2.0.6"
description = "SDK for building LexaShield processing engines"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "LexaShield Team", email = "prashant@lexashield.com"}
]
keywords = ["lexashield", "legal", "engine", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "aiohttp>=3.13.5",
    "python-multipart>=0.0.27",
    "tenacity>=9.1.4",
    "pyhtml2pdf>=0.1.0",
    "pypdf>=6.10.2",
    "boto3==1.43.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

[project.scripts]
lexashield-engine = "lexashield_engine.cli:main"

[tool.setuptools.package-data]
lexashield_engine = [
    "pdf_assets/*.pdf",
    "pdf_assets/*.png",
    "pdf_assets/*.css",
]
